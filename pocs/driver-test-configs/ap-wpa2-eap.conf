driver=test
interface=ap1
driver_params=test_socket=@RUNDIR@/ap1
ctrl_interface=@RUNDIR@/hostapd-ctrl
ssid=test-eap
hw_mode=g
channel=1
ieee80211n=1
wmm_enabled=1
wpa=2
wpa_key_mgmt=WPA-EAP WPA-EAP-SHA256
rsn_pairwise=CCMP
ieee80211w=1
ieee8021x=1
eap_server=1
eap_user_file=@AUTH_SERV@/eap_user.conf
ca_cert=@AUTH_SERV@/ca.pem
server_cert=@AUTH_SERV@/server.pem
private_key=@AUTH_SERV@/server.key
dh_file=@AUTH_SERV@/dh.conf
eap_reauth_period=5
logger_stdout=-1
logger_stdout_level=0
